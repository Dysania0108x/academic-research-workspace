name: Validate app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/pdfGeometry.test.js tests/evidenceSource.test.js tests/captureRules.test.js tests/quoteMatch.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m py_compile backend/main.py
      - run: python -m unittest discover -s backend/tests -v
