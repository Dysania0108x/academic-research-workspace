name: Validate app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/pdfGeometry.test.js tests/evidenceSource.test.js tests/captureRules.test.js tests/quoteMatch.test.js tests/themePalette.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m py_compile backend/main.py
      - run: python -m unittest discover -s backend/tests -v

  extension-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate extension package with synthetic public configuration
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
          VITE_API_BASE_URL: https://api.example.com
        run: node scripts/build-extension-config.mjs
      - name: Bundle PDF.js
        run: |
          mkdir -p extension/vendor
          npm install --prefix /tmp/nuscope-pdfjs --no-save --ignore-scripts pdfjs-dist@4.10.38
          cp /tmp/nuscope-pdfjs/node_modules/pdfjs-dist/build/pdf.mjs extension/vendor/pdf.mjs
          cp /tmp/nuscope-pdfjs/node_modules/pdfjs-dist/build/pdf.worker.mjs extension/vendor/pdf.worker.mjs
          cp /tmp/nuscope-pdfjs/node_modules/pdfjs-dist/web/pdf_viewer.css extension/vendor/pdf_viewer.css
      - name: Validate extension modules and assets
        run: |
          node --check extension/connection.js
          node --check extension/pdf-analysis.js
          node --check extension/reader.js
          node --check extension/pdf-import.js
          node --check extension/quoteMatch.mjs
          node --check extension/excerpts-cloud.js
          test -s extension/vendor/pdf.mjs
          test -s extension/vendor/pdf.worker.mjs
          test -s extension/vendor/pdf_viewer.css
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('extension/manifest.json'));if(!m.host_permissions.includes('https://api.example.com/*'))process.exit(1)"
