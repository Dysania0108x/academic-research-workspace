name: Package NUScope Chrome Extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public extension configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: node scripts/build-extension-config.mjs
      - name: Bundle PDF.js reader dependencies
        run: |
          npm install --no-save --package-lock=false pdfjs-dist@4.10.38
          mkdir -p extension/vendor
          cp node_modules/pdfjs-dist/build/pdf.mjs extension/vendor/pdf.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs extension/vendor/pdf.worker.mjs
          cp node_modules/pdfjs-dist/web/pdf_viewer.css extension/vendor/pdf_viewer.css
      - name: Check JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/panel.js
          node --check extension/connection.js
          node --check extension/config.js
          node --check extension/excerpts-cloud.js
          node --check extension/captureRules.mjs
          node --check extension/themePalette.mjs
          node --check extension/pdf-analysis.js
          node --check extension/pdf-import.js
          node --check extension/reader.js
          node --check extension/quoteMatch.mjs
          test -s extension/vendor/pdf.mjs
          test -s extension/vendor/pdf.worker.mjs
          node --test tests/extensionSyncRules.test.js
      - name: Package unpacked extension
        run: |
          cd extension
          zip -qr ../nuscope-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: nuscope-extension
          path: nuscope-extension.zip
          retention-days: 7
