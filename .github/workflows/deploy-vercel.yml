name: Deploy NUScope to Vercel (fallback)

# Vercel Deploy Hook is an alternative to GitHub->Vercel push webhooks.
# Deploy Hook must target the production main branch.
on:
  workflow_run:
    workflows: ["Validate app"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuscope-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require configured deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set repository secret VERCEL_DEPLOY_HOOK_URL to the Production main-branch deploy hook URL from Vercel."
            exit 1
          fi
          case "$DEPLOY_HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *) echo "::error::Unexpected Vercel deploy hook URL"; exit 1 ;;
          esac
      - name: Trigger production deployment
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 45 -X POST "$DEPLOY_HOOK" -o deploy-response.json
          python3 - <<'PY'
          import json
          with open('deploy-response.json', encoding='utf-8') as f:
              result = json.load(f)
          if result.get('error'):
              raise SystemExit('Vercel rejected deployment trigger')
          print('Vercel deploy hook accepted. Verify the resulting Production deployment in Vercel.')
          PY
