<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Assistant</title><link rel="stylesheet" href="panel.css"></head><body><header><strong>Research Assistant</strong><small>Capture evidence with its original source</small></header><main><section id="settings"><h2>Connection</h2><label>Supabase URL<input id="url" type="url" placeholder="https://your-project.supabase.co"></label><label>Publishable key<input id="key" type="password" autocomplete="off"></label><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button><button id="logout" hidden>Sign out</button></section><section id="capture" hidden><h2>Capture source</h2><label>Project<select id="project"></select></label><button id="read">Capture selection from current tab</button><label>Page title<input id="title"></label><label>Source URL<input id="sourceUrl" type="url"></label><label>Exact excerpt<textarea id="excerpt" rows="8" placeholder="Select a passage on a web page, then click Capture"></textarea></label><label>Note (optional)<textarea id="note" rows="3"></textarea></label><button id="save">Save to research inbox</button><p class="hint">Captured excerpts are unverified until reviewed in your research workflow.</p></section><p id="status" role="status"></p></main><script src="panel.js"></script></body></html>
